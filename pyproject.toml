[build-system]
# >=77 is the real floor, not a preference: the SPDX `license` string and
# `license-files` below are PEP 639, which older setuptools rejects outright.
# setuptools-scm used to be required here and was never configured -- the
# version was a hardcoded string -- so it only slowed every build down.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gwcat"
# ONE version authority: gwcat/__init__.py's __version__ (read statically, no
# import). It was duplicated here, so `pip show gwcat` and `gwcat.__version__`
# could disagree -- and both are stamped into exported files as provenance.
dynamic = ["version"]
description = "Fast preprocessing of GWTC-2.1/3/4/5 cosmo PE files for dark-siren cosmology"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
    {name = "gwcat contributors"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy>=1.22",
    "h5py>=3.6",
    "astropy>=5.0",
    "pyyaml>=5.1",
]

[project.optional-dependencies]
ingest = [
    "pesummary>=0.13",
    "bilby>=1.1",
]
fetch = [
    "requests>=2.28",
    "tqdm>=4.64",
]
all = [
    "gwcat[ingest,fetch]",
]
dev = [
    "gwcat[all]",
    "pytest>=7",
]

[project.scripts]
gwcat = "gwcat.cli:main"
gwcat-ingest = "gwcat.ingest:_cli"
gwcat-fetch = "gwcat.fetch:_cli"

[project.urls]
Documentation = "https://github.com/ignaciomagana/gwcat"
Repository = "https://github.com/ignaciomagana/gwcat"

[tool.setuptools.dynamic]
version = {attr = "gwcat.__version__"}

[tool.setuptools.packages.find]
include = ["gwcat*"]

[tool.setuptools.package-data]
gwcat = [
    "data/event_lists/*.txt",
    "data/event_lists/*.yaml",
    "data/*.yaml",
    "manifests/releases/*.yaml",
    "manifests/injections/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
